name: Publish

# Phase 11, distribution: publish the package to PyPI and the
# demo image to GHCR when a GitHub Release is published.
#
# PyPI publishing uses trusted publishing (OpenID Connect):
# there is no PyPI API token stored anywhere in this
# repository. The PyPI project must name this exact file as
# its trusted publisher first -- project name sre-agent-cli,
# owner KakoozaJerry, repository sre-agent, workflow file
# publish.yml, environment pypi -- or PyPI refuses the
# upload. docs/publishing.md carries those steps in plain
# words.
#
# workflow_dispatch lets the maintainer run the same jobs by
# hand (for example, the first publication, whose release
# already exists). It publishes whatever version pyproject.toml
# carries at the chosen ref, so check the version first.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi:
    name: Publish to PyPI (trusted publishing)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sre-agent-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the distribution and check it
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  ghcr:
    name: Publish the demo image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR image names are lowercase: kakoozajerry is the
          # lowercase form of the repository owner's name. The
          # image is the public-safe hosted demo (Dockerfile.hosted),
          # the demo build that refuses to start without a token.
          images: ghcr.io/kakoozajerry/sre-agent-demo
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha
      - name: Build and push the demo image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hosted
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
